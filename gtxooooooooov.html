<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sneakers</title>
    <link rel="stylesheet" href="goa.css">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

    <header>
        <div class="logo">sneakers</div>

        <nav>
        <a href="#collections">Collections</a>
        <a href="#men">Men</a>
        <a href="#women">Women</a>
        <a href="#about">About</a>
        <a href="#contact">Contact</a>
        </nav>

        <div class="icons">
            <i class="fa-solid fa-cart-shopping"></i>
            <img src="./image-avatar.png" alt="">
        </div>
    </header>

    <main>
        <div class="left">

            <img class="main-img"
                src="./image-product-1.jpg"
                alt="">

            <div class="gallery">
                <img src="./image-product-1-thumbnail.jpg">
                <img src="./image-product-2-thumbnail.jpg">
                <img src="./image-product-3-thumbnail.jpg">
                <img src="./image-product-4-thumbnail.jpg">
            </div>

        </div>

        <div class="right">

            <span class="company">SNEAKER COMPANY</span>

            <h1>Fall Limited Edition Sneakers</h1>

            <p>
                These low-profile sneakers are your perfect casual wear
                companion. Featuring a durable rubber outer sole,
                they'll withstand everything the weather can offer.
            </p>

            <div class="price-box">
                <div>
                    <h2>$125.00 <span>50%</span></h2>
                    <del>$250.00</del>
                </div>
            </div>

            <div class="cart-section">

                <div class="counter">
                    <button>-</button>
                    <span>0</span>
                    <button>+</button>
                </div>

                <button class="cart-btn">
                    <i class="fa-solid fa-cart-shopping"></i>
                    Add to cart
                </button>

            </div>

        </div>
    </main>

</div>

</body>
</html>
