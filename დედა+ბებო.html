<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ჩემი საყვარელი ადამიანები ❤️</title>
    <link rel="stylesheet" href="დედა+ბებო.css">
</head>
<body>

<div class="hearts"></div>

<div class="container">

    <h1>❤️ დედას და ბებიას ❤️</h1>

    <p class="text">
        თქვენ ხართ ჩემი ცხოვრების ყველაზე ძვირფასი ადამიანები.
        მადლობა ყველაფრისთვის, რასაც ყოველდღე აკეთებთ ჩემთვის.
    </p>

    <div class="photos">

        <div class="card">
            <img src="mom.jpg" alt="">
            <h2>დედა 💖</h2>
        </div>

        <div class="card">
            <img src="grandma.jpg" alt="">
            <h2>ბებია 🌸</h2>
        </div>

    </div>

    <button onclick="showMessage()">
        დააჭირე ❤️
    </button>

    <h2 id="message"></h2>

</div>

<script src="დედა+ბებო.js"></script>

</body>
</html>
