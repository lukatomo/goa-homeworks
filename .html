<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Obby</title>

<style>
body{
    margin:0;
    background:#87ceeb;
    overflow:hidden;
}

#game{
    width:100vw;
    height:100vh;
    position:relative;
}

.platform{
    position:absolute;
    background:#444;
}

#player{
    width:40px;
    height:40px;
    background:dodgerblue;
    position:absolute;
    left:50px;
    top:500px;
}

.lava{
    position:absolute;
    background:red;
}

#finish{
    position:absolute;
    background:lime;
}
</style>
</head>
<body>

<div id="game">
    <div id="player"></div>

    <div class="platform" style="left:0;top:550px;width:250px;height:30px;"></div>
    <div class="platform" style="left:320px;top:470px;width:150px;height:30px;"></div>
    <div class="platform" style="left:550px;top:390px;width:150px;height:30px;"></div>
    <div class="platform" style="left:800px;top:300px;width:180px;height:30px;"></div>

    <div class="lava" style="left:250px;top:550px;width:70px;height:30px;"></div>
    <div class="lava" style="left:470px;top:470px;width:80px;height:30px;"></div>
    <div class="lava" style="left:700px;top:390px;width:100px;height:30px;"></div>

    <div id="finish" style="left:900px;top:240px;width:60px;height:60px;"></div>
</div>

<script>
const player = document.getElementById("player");

let x = 50;
let y = 500;
let vx = 0;
let vy = 0;
let onGround = false;

const keys = {};

document.addEventListener("keydown",e=>{
    keys[e.key] = true;

    if((e.key===" " || e.key==="ArrowUp") && onGround){
        vy = -15;
    }
});

document.addEventListener("keyup",e=>{
    keys[e.key] = false;
});

function resetGame(){
    x = 50;
    y = 500;
    vx = 0;
    vy = 0;
}

function update(){

    if(keys["ArrowLeft"]) x -= 5;
    if(keys["ArrowRight"]) x += 5;

    vy += 0.8;
    y += vy;

    onGround = false;

    document.querySelectorAll(".platform").forEach(platform=>{
        const p = platform.getBoundingClientRect();

        if(
            x + 40 > p.left &&
            x < p.right &&
            y + 40 > p.top &&
            y + 40 < p.top + 20 &&
            vy >= 0
        ){
            y = p.top - 40;
            vy = 0;
            onGround = true;
        }
    });

    document.querySelectorAll(".lava").forEach(lava=>{
        const l = lava.getBoundingClientRect();

        if(
            x + 40 > l.left &&
            x < l.right &&
            y + 40 > l.top &&
            y < l.bottom
        ){
            alert("💀 You Died!");
            resetGame();
        }
    });

    const finish = document.getElementById("finish").getBoundingClientRect();

    if(
        x + 40 > finish.left &&
        x < finish.right &&
        y + 40 > finish.top &&
        y < finish.bottom
    ){
        alert("🏆 You Win!");
        resetGame();
    }

    if(y > window.innerHeight){
        resetGame();
    }

    player.style.left = x + "px";
    player.style.top = y + "px";

    requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
