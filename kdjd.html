    <script>

            { id: 1, title: "სპორტული ფეხსაცმელი", price: "120 ₾", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=400" },

        const productsContainer = document.getElementById('products-container');
        const cartCount = document.getElementById('cart-count');
        let currentCartCount = 0;

        function displayProducts() {
            productsContainer.innerHTML = products.map(product => `
                <div class="product-card">
                    <img src="${product.image}" alt="${product.title}" class="product-img">
                    <div class="product-info">
                        <h3 class="product-title">${product.title}</h3>
                        <p class="product-price">${product.price}</p>
                        <button class="add-to-cart" onclick="addToCart()">კალათაში დამატება</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart() {
            currentCartCount++;
            cartCount.textContent = currentCartCount;
            cartCount.style.transform = "scale(1.3)";
            setTimeout(() => cartCount.style.transform = "scale(1)", 200);
        }

        /* --- თამაშის ფუნქციონალი --- */
        const gameArea = document.getElementById('game-area');
        const basket = document.getElementById('basket');
        const scoreDisplay = document.getElementById('score');
        const livesDisplay = document.getElementById('lives');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        const itemsPool = ['👟', '⌚', '🎧', '🎒', '📱', '👕'];
        let score = 0;
        let lives = 3;
        let itemInterval;
        let isGameOver = false;
        let itemSpeed = 4;

        // კალათის მოძრაობა მაუსზე თამაშის ზონაში
        gameArea.addEventListener('mousemove', (e) => {
            if (isGameOver) return;
            const rect = gameArea.getBoundingClientRect();
            let relativeX = e.clientX - rect.left;
            
            if (relativeX < 30) relativeX = 30;
            if (relativeX > rect.width - 30) relativeX = rect.width - 30;
            
            basket.style.left = (relativeX - 30) + 'px';
        });

        function spawnItem() {
            if (isGameOver) return;

            const item = document.createElement('div');
            item.classList.add('falling-item');
            item.innerText = itemsPool[Math.floor(Math.random() * itemsPool.length)];
            
            const randomX = Math.floor(Math.random() * (gameArea.clientWidth - 40));
            item.style.left = randomX + 'px';
            item.style.top = '0px';

            gameArea.appendChild(item);

            let itemY = 0;
            function fall() {
                if (isGameOver) {
                    item.remove();
                    return;
                }

                itemY += itemSpeed;
                item.style.top = itemY + 'px';

                const basketRect = basket.getBoundingClientRect();
                const itemRect = item.getBoundingClientRect();

                // შეჯახების შემოწმება
                if (
                    itemRect.bottom >= basketRect.top &&
                    itemRect.right >= basketRect.left &&
                    itemRect.left <= basketRect.right &&
                    itemRect.top <= basketRect.bottom
                ) {
                    score++;
                    scoreDisplay.innerText = score;
                    item.remove();
                    if (score % 5 === 0) itemSpeed += 0.5;
                    return;
                }

                // თუ მიწას დაეცა
                if (itemY > gameArea.clientHeight - 40) {
                    lives--;
                    livesDisplay.innerText = lives;
                    item.remove();
                    if (lives <= 0) endGame();
                    return;
                }

                requestAnimationFrame(fall);
            }
            requestAnimationFrame(fall);
        }

        function endGame() {
            isGameOver = true;
            clearInterval(itemInterval);
            finalScoreDisplay.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            document.querySelectorAll('.falling-item').forEach(el => el.remove());
            score = 0;
            lives = 3;
            itemSpeed = 4;
            isGameOver = false;
            scoreDisplay.innerText = score;
            livesDisplay.innerText = lives;
            gameOverScreen.style.display = 'none';
            basket.style.left = '170px';
            startSpawning();
        }

        function startSpawning() {
            itemInterval = setInterval(spawnItem, 1200);
        }

        // საიტის გაშვება
        displayProducts();
        startSpawning();

    <section class="container" id="products-section">
        <h2 class="section-title">ჩვენი პროდუქცია</h2>
        <div class="products-grid" id="products-container"></div>
    </section>

    <section class="game-section" id="game-section">
        <h2>GEOMETRY DASH: MINI ARCADE</h2>
        <p>დააჭირე <b>Space-ს</b> ან <b>დააკლიკე სათამაშო ველს</b> გადასახტომად.</p>

        <div class="game-container" id="game-container" onclick="jump()">
            <div class="game-score">ქულა: <span id="game-score-val">0</span></div>
            <div class="player" id="player"></div>
            <div class="floor"></div>

            <div class="game-over-screen" id="game-over">
                <h2>BOOM! Game Over 💥</h2>
                <p>შენი ქულაა: <span id="final-score">0</span></p>
                <button onclick="event.stopPropagation(); restartGame();">ცადე თავიდან</button>
            </div>
        </div>
    </section>

    <script>
        /* --- მაღაზიის კოდი --- */
        const products = [
            { id: 1, title: "სპორტული ფეხსაცმელი", price: "120 ₾", image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?q=80&w=400" },
            { id: 2, title: "სმარტ საათი", price: "250 ₾", image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?q=80&w=400" },
            { id: 3, title: "უკაბელო ყურსასმენები", price: "180 ₾", image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=400" }
        ];

        const productsContainer = document.getElementById('products-container');
        const cartCount = document.getElementById('cart-count');
        let currentCartCount = 0;

        productsContainer.innerHTML = products.map(product => `
            <div class="product-card">
                <img src="${product.image}" alt="${product.title}" class="product-img">
                <div class="product-info">
                    <h3 class="product-title">${product.title}</h3>
                    <p class="product-price">${product.price}</p>
                    <button class="add-to-cart" onclick="addToCart()">კალათაში დამატება</button>
                </div>
            </div>
        `).join('');

        function addToCart() {
            currentCartCount++;
            cartCount.textContent = currentCartCount;
        }

        /* --- GEOMETRY DASH ლოგიკა --- */
        const player = document.getElementById('player');
        const gameContainer = document.getElementById('game-container');
        const gameOverScreen = document.getElementById('game-over');
        const scoreVal = document.getElementById('game-score-val');
        const finalScore = document.getElementById('final-score');

        let isJumping = false;
        let isGameOver = false;
        let score = 0;
        let obstacleTimeout;
        let collisionCheckInterval;

        // გადახტომის ფუნქცია
        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            player.classList.add('jump-animation');

            // ანიმაციის დასრულების შემდეგ კლასის მოხსნა
            setTimeout(() => {
                player.classList.remove('jump-animation');
                isJumping = false;
            }, 600);
        }

        // Space ღილაკზე გადახტომა
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // გვერდი რომ არ ჩამოცურდეს
                jump();
            }
        });

        // შიპების შექმნა
        function spawnObstacle() {
            if (isGameOver) return;

            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.style.right = '-40px'; // იწყებს ეკრანის გარედან
            gameContainer.appendChild(obstacle);

            let obstaclePos = -40;
            let obstacleSpeed = 5 + Math.floor(score / 5); // ქულებთან ერთად სიჩქარე იზრდება

            function move() {
                if (isGameOver) {
                    obstacle.remove();
                    return;
                }

                obstaclePos += obstacleSpeed;
                obstacle.style.right = obstaclePos + 'px';

                // როცა შიპი მარცხენა მხარეს გავა (მოთამაშეს ასცდება)
                if (obstaclePos > gameContainer.clientWidth) {
                    score++;
                    scoreVal.innerText = score;
                    obstacle.remove();
                    return;
                }

                requestAnimationFrame(move);
            }

            requestAnimationFrame(move);

            // შემდეგი შიპის დრო (რანდომული ინტერვალით)
            let nextSpawn = 1500 + Math.random() * 2000;
            obstacleTimeout = setTimeout(spawnObstacle, nextSpawn);
        }

        // შეჯახების შემოწმება (Collision Detection)
        function checkCollision() {
            collisionCheckInterval = setInterval(() => {
                const obstacles = document.querySelectorAll('.obstacle');
                
                obstacles.forEach(obs => {
                    const playerRect = player.getBoundingClientRect();
                    const obsRect = obs.getBoundingClientRect();

                    // ჰორიზონტალური და ვერტიკალური გადაკვეთის ზუსტი ფორმულა
                    if (
                        playerRect.right > obsRect.left + 5 &&
                        playerRect.left < obsRect.right - 5 &&
                        playerRect.bottom > obsRect.top + 5
                    ) {
                        endGame();
                    }
                });
            }, 10);
        }

        function endGame() {
            isGameOver = true;
            clearTimeout(obstacleTimeout);
            clearInterval(collisionCheckInterval);
            finalScore.innerText = score;
            gameOverScreen.style.display = 'flex';
        }

        function restartGame() {
            document.querySelectorAll('.obstacle').forEach(obs => obs.remove());
            score = 0;
            scoreVal.innerText = score;
            isGameOver = false;
            isJumping = false;
            player.classList.remove('jump-animation');
            gameOverScreen.style.display = 'none';
            
            spawnObstacle();
            checkCollision();
        }

        // თამაშის დაწყება
        spawnObstacle();
        checkCollision();
    </script>
</body>
</html>
